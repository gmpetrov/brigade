# Deploys Brigade to the VPS (deploy/vps) on each push to main that touches it: builds
# the images into GitHub's registry, copies deploy/vps to /opt/brigade on the server
# and runs its deploy.sh there over SSH. Needs the VPS_SSH_KEY secret and the VPS_HOST
# and VPS_KNOWN_HOSTS variables.
name: Deploy to the VPS

on:
  push:
    branches: [main]
    paths:
      - apps/**
      # The Mac app ships through its own release (desktop-release.yml).
      - '!apps/desktop/**'
      - '!apps/computer-use-macos/**'
      - packages/**
      - patches/**
      - deploy/vps/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - tsconfig.base.json
      - .github/workflows/vps.yml
  workflow_dispatch:

# One deploy at a time; a newer push waits for the one running.
concurrency:
  group: vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # The server is ARM, so the images build on an ARM runner.
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: deploy/vps/docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Deploy on the server
        env:
          HOST: root@${{ vars.VPS_HOST }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          scp deploy/vps/compose.yml deploy/vps/deploy.sh "$HOST:/opt/brigade/"
          ssh "$HOST" "TAG=$TAG ACTOR=$ACTOR /opt/brigade/deploy.sh" <<<"$REGISTRY_TOKEN"

      - name: Check
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 https://api.vps.brigade.lol/health
          curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 3 https://vps.brigade.lol/sign-in
