# Releases Brigade.app (apps/desktop, with apps/computer-use-macos inside it on macOS) when a
# desktop-v* tag is pushed, e.g. `git tag desktop-v0.4.0 && git push origin desktop-v0.4.0`:
# builds it for macOS (universal, signed with the Developer ID and notarized), Windows and Linux,
# and publishes one GitHub Release with every platform's files. Installed apps update from it:
#   - Brigade.app (Electron) reads latest-mac.yml, latest.yml or latest-linux.yml (updates.ts);
#   - the Tauri Brigade.app it replaces reads latest.json, which points it at Brigade.app.tar.gz:
#     the Electron app, signed with the Tauri update key, which that app's updater installs in
#     its place. Keep publishing it while Macs may still run a Tauri version (0.3.x).
# The dashboard links to Brigade.dmg; Brigade-Setup.exe and Brigade-x86_64.AppImage are the
# Windows and Linux downloads.
#
# Secrets: APPLE_CERTIFICATE (the Developer ID Application .p12, base64),
# APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY (an App Store Connect API key's .p8, for
# notarization), APPLE_API_KEY_ID, APPLE_API_ISSUER, TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (signs latest.json's archive for the Tauri apps; its public
# key is in their tauri.conf.json, kept in git history).
name: Release Brigade.app

on:
  push:
    tags: ['desktop-v*']
  # A pull request that changes how the release is built gets the macOS app built, signed and
  # notarized as a release does, with nothing published: a release found the helper's signature
  # broken only once it was tagged.
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/electron-builder.config.cjs'
      - 'apps/desktop/scripts/**'
      - 'apps/desktop/build/**'
      - 'apps/computer-use-macos/scripts/**'

concurrency:
  group: desktop-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          # A pull request's trial build.
          [ "$GITHUB_EVENT_NAME" != pull_request ] || VERSION="0.0.${{ github.event.pull_request.number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd apps/desktop && npm pkg set version="$VERSION"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @brigade/desktop...

      # For Brigade Computer Use.app, which its own script signs; electron-builder signs the rest
      # from CSC_LINK below.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          set -o pipefail
          apps/desktop/scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          rm "$APPLE_API_KEY"

      # Teammates can't read a job's log, but they can read its annotations.
      - name: Errors as annotations
        if: failure()
        run: |
          grep -E '⨯|Error|error:|"message"|"path"|"statusSummary"' "$RUNNER_TEMP/build.log" 2>/dev/null |
            grep -v '^\s*at ' | sort -u | head -30 | sed 's/^/::error ::/' || true

      - name: Check the app
        working-directory: apps/desktop/release/out
        run: |
          APP=mac-universal/Brigade.app
          HELPER="$APP/Contents/Resources/Brigade Computer Use.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
          # Every check runs; each failure shows as an annotation with what it printed, which
          # teammates can read (they can't read the job's log).
          failed=0
          check() {
            local name="$1"; shift
            local out
            if ! out="$("$@" 2>&1)"; then
              echo "::error title=$name::$(printf '%s' "$out" | tail -8 | tr '\n' ' ')"
              failed=1
            fi
          }
          check "App signature" codesign --verify --deep --strict --verbose=2 "$APP"
          check "Gatekeeper" spctl --assess --type execute --verbose=2 "$APP"
          check "Stapled ticket" xcrun stapler validate "$APP"
          # The executable the Tauri app's login item starts.
          check "Executable name" test "$(plist CFBundleExecutable)" = brigade-desktop
          check "Version $(plist CFBundleShortVersionString), not $VERSION" test "$(plist CFBundleShortVersionString)" = "$VERSION"
          # The helper keeps its own signature, which its permissions are tied to.
          check "Helper signature" codesign --verify --strict --verbose=2 "$HELPER"
          check "Helper signed with the Developer ID" sh -c 'codesign -dvv "$1" 2>&1 | grep "^Authority=Developer ID Application"' sh "$HELPER"
          exit "$failed"

      - name: The Tauri apps' update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop/release/out
        run: |
          # As the Tauri bundler made it: one Brigade.app folder at the root, no AppleDouble files.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf Brigade.app.tar.gz -C mac-universal Brigade.app
          if tar -tzf Brigade.app.tar.gz | grep -v '^Brigade\.app' | grep -q .; then echo "Unexpected entries" >&2; exit 1; fi
          if tar -tzf Brigade.app.tar.gz | grep -q '/\._'; then echo "AppleDouble files in the archive" >&2; exit 1; fi
          npx --yes @tauri-apps/cli@2.12.4 signer sign Brigade.app.tar.gz
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Brigade.app.tar.gz"
          SIGNATURE="$(cat Brigade.app.tar.gz.sig)"
          # One universal app serves both architectures.
          jq -n --arg v "$VERSION" --arg url "$URL" --arg sig "$SIGNATURE" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            version: $v, pub_date: $date, notes: "",
            platforms: { "darwin-aarch64": { url: $url, signature: $sig }, "darwin-x86_64": { url: $url, signature: $sig } }
          }' > latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/desktop/release/out/Brigade.dmg
            apps/desktop/release/out/Brigade.dmg.blockmap
            apps/desktop/release/out/*-mac.zip
            apps/desktop/release/out/*-mac.zip.blockmap
            apps/desktop/release/out/latest-mac.yml
            apps/desktop/release/out/Brigade.app.tar.gz
            apps/desktop/release/out/latest.json

  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Version from the tag
        run: cd apps/desktop && npm pkg set version="${GITHUB_REF_NAME#desktop-v}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @brigade/desktop...
      # Not signed: Brigade has no Windows code-signing certificate yet (SmartScreen warns).
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: apps/desktop/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            apps/desktop/release/out/Brigade-Setup.exe
            apps/desktop/release/out/Brigade-Setup.exe.blockmap
            apps/desktop/release/out/latest.yml

  linux:
    if: github.event_name == 'push'
    # The oldest Ubuntu GitHub runs: an AppImage runs on systems as new as or newer than its build's.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Version from the tag
        run: cd apps/desktop && npm pkg set version="${GITHUB_REF_NAME#desktop-v}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @brigade/desktop...
      - name: Build
        run: apps/desktop/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            apps/desktop/release/out/Brigade-x86_64.AppImage
            apps/desktop/release/out/*.deb
            apps/desktop/release/out/latest-linux.yml

  publish:
    if: github.event_name == 'push'
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --repo "${{ github.repository }}" \
            --title "Brigade.app ${GITHUB_REF_NAME#desktop-v}" --generate-notes --latest
