# Releases Brigade.app (apps/desktop, with apps/computer-use-macos inside it) when a
# desktop-v* tag is pushed, e.g. `git tag desktop-v0.2.0 && git push origin desktop-v0.2.0`:
# builds a universal app, signs it with the Developer ID, notarizes it, and publishes a
# GitHub Release with Brigade.dmg (what the dashboard links to) and latest.json, which
# installed apps check to update themselves.
#
# Secrets: APPLE_CERTIFICATE (the Developer ID Application .p12, base64),
# APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY (an App Store Connect API key's .p8, for
# notarization), APPLE_API_KEY_ID, APPLE_API_ISSUER, TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (signs updates; its public key is in tauri.conf.json).
name: Release Brigade.app

on:
  push:
    tags: ['desktop-v*']

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        run: |
          VERSION="${VERSION#desktop-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd apps/desktop/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > conf.json && mv conf.json tauri.conf.json

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @brigade/desktop

      # Newer rustup no longer installs the toolchain rust-toolchain.toml pins on its own.
      - name: Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/rust-toolchain.toml') }}

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          TARGET: universal-apple-darwin
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          apps/desktop/scripts/build.sh
          rm "$APPLE_API_KEY_PATH"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          OUT="$RUNNER_TEMP/release" && mkdir -p "$OUT"
          cp "$BUNDLE"/dmg/*.dmg "$OUT/Brigade.dmg"
          cp "$BUNDLE/macos/Brigade.app.tar.gz" "$OUT/Brigade.app.tar.gz"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Brigade.app.tar.gz"
          SIGNATURE="$(cat "$BUNDLE/macos/Brigade.app.tar.gz.sig")"
          # One universal app serves both architectures.
          jq -n --arg v "$VERSION" --arg url "$URL" --arg sig "$SIGNATURE" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            version: $v, pub_date: $date, notes: "",
            platforms: { "darwin-aarch64": { url: $url, signature: $sig }, "darwin-x86_64": { url: $url, signature: $sig } }
          }' > "$OUT/latest.json"
          gh release create "${{ github.ref_name }}" "$OUT"/* --title "Brigade.app $VERSION" --generate-notes --latest
