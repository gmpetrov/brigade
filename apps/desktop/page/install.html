<!doctype html>
<!-- The animation that installs an app (src/install-animation.ts): a transparent window over the
     screen, which takes no click. The app's pane glows and folds into its icon; then the icon
     opens out into the app's own window, in a burst of light. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"
    />
    <title>Installing</title>
    <link rel="stylesheet" href="install.css" />
    <script src="install.js" defer></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
  </body>
</html>
