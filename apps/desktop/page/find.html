<!doctype html>
<!-- The find bar over the dashboard's page (src/find.ts): a view of its own, so the search never
     finds what is typed here. Transparent around the card, for its shadow. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Find</title>
    <link rel="stylesheet" href="find.css" />
    <script src="find.js" defer></script>
  </head>
  <body>
    <div class="card" role="search">
      <label class="field">
        <input
          id="text"
          type="text"
          placeholder="Find"
          aria-label="Find in page"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="count" aria-live="polite"></span>
      </label>
      <button id="previous" type="button" aria-label="Previous match" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg>
      </button>
      <button id="next" type="button" aria-label="Next match" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5" /></svg>
      </button>
      <button id="close" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
      </button>
    </div>
  </body>
</html>
